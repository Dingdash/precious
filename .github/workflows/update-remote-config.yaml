name: Update Firebase Remote Config

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches: 'develop'
  workflow_dispatch:
  # workflow_run:
  #   workflows: [Build And Deploy to Google Playstore]
  #   types: [completed]
    
permissions:
  contents: read

jobs:
  update_remote_config: 
    name: Update Firebase Remote Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'
          cache-dependency-path: 'cicd/package-lock.json' 

      - name: Install Packages
        working-directory: ./cicd/firebase
        run: |
          npm install
          node index.js

      # - name: Create Service Account Key JSON
      #   run: |
      #     echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > ./cicd/SERVICE_ACCOUNT_KEY.json
      
      - name: Run Firebase Updater Script
        run: node cicd/firebase_updater.js
            